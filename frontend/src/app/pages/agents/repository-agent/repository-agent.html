@if (loading) {
  <div class="loader-container">
    <app-loader />
  </div>
} @else {
  <div class="repository-agent-container">
    <div class="heading">Understand any repository in seconds</div>
    <div class="subheading">
      Paste a public repository URL and RepoMind's Repository Agent will map it's structure, stack
      and architecture.
    </div>
    <div class="analyze-form">
      <input
        type="text"
        placeholder="https://github.com/your-org/your-repo"
        class="repo-input"
        [(ngModel)]="githubUrl"
      />
      <button class="blue-button" (click)="analyze()" [disabled]="!githubUrl.trim() || loading">
        Analyze
      </button>
    </div>

    <div class="helper-text">
      Works with any public repository — no installation or account required.
    </div>
  </div>
}
